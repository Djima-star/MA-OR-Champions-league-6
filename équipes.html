<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Équipes - MA'OR Champions League</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>🏆 MA'OR CHAMPIONS LEAGUE</h1>

    <p>Les équipes participantes</p>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="matchs.html">⚽ Matchs</a>
        <a href="classement.html">🏆 Classement</a>
        <a href="equipes.html">👥 Équipes</a>
        <a href="admin.html">🔐 Admin</a>
    </nav>

</header>


<main class="container">

    <h2>👥 Les 15 équipes</h2>

    <br>

    <div id="teams" class="team-grid"></div>

</main>


<footer>

    © 2026 MA'OR Champions League

</footer>


<script src="js/data.js"></script>

<script>

    const teamsContainer = document.getElementById("teams");

    TEAMS.forEach((team, index) => {

        const teamElement = document.createElement("div");

        teamElement.className = "team";

        teamElement.innerHTML = `
            <h3>⚽ ${team}</h3>
            <p>Équipe ${index + 1}</p>
        `;

        teamsContainer.appendChild(teamElement);

    });

</script>

</body>

</html>
