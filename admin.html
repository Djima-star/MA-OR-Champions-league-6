    <style>
        .admin-box {
            max-width: 600px;
            margin: 30px auto;
            background: #0c1d31;
            padding: 25px;
            border-radius: 15px;
        }

        .admin-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .admin-box select,
        .admin-box input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #35536f;
            background: #102b45;
            color: white;
            font-size: 16px;
        }

        .admin-box button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
