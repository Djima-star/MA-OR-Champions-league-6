<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administration - MA'OR</title><link rel="stylesheet" href="style.css"></head>
<body><header><nav class="navbar"><div class="logo">MA'OR ADMIN</div><ul class="nav-links"><li><a href="index.html">Accueil</a></li><li><a href="matches.html">Matchs</a></li><li><a href="classement.html">Classement</a></li></ul></nav></header>
<main class="container">
<div id="loginSection" class="form-card"><h2>Connexion administrateur</h2><br><form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="email" required></div><div class="form-group"><label>Mot de passe</label><input type="password" id="password" required></div><button type="submit" class="btn btn-primary">Se connecter</button></form><div id="loginMessage"></div></div>
<div id="adminSection" style="display:none"><div class="admin-panel"><h2>Tableau de bord</h2><p id="adminUser"></p><br><button id="logoutBtn" class="btn btn-danger">Déconnexion</button></div>
<div class="admin-section"><h2>Ajouter une équipe</h2><br><form id="teamForm"><div class="form-group"><label>Nom de l'équipe</label><input type="text" id="teamName" required></div><div class="form-group"><label>Nom court</label><input type="text" id="teamShortName"></div><div class="form-group"><label>URL du logo</label><input type="url" id="teamLogo" placeholder="https://..."></div><button class="btn btn-primary" type="submit">Ajouter l'équipe</button></form><div id="teamMessage"></div></div>
<div class="admin-section"><h2>Créer un match</h2><br><form id="matchForm"><div class="form-group"><label>Équipe domicile</label><select id="homeTeam" required><option value="">Choisir</option></select></div><div class="form-group"><label>Équipe extérieure</label><select id="awayTeam" required><option value="">Choisir</option></select></div><div class="form-group"><label>Date et heure</label><input type="datetime-local" id="matchDate" required></div><button class="btn btn-primary" type="submit">Créer le match</button></form><div id="matchMessage"></div></div>
<div class="admin-section"><h2>Gestion des scores</h2><br><div id="adminMatches">Chargement...</div></div></div>
</main><footer>© 2026 MA'OR Champions League</footer><script type="module" src="js/admin.js"></script></body></html>
