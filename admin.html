<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administration - MA'OR Champions League</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #06101d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        .admin-box {
            background: #0c1d31;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #244967;
        }

        .admin-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #41627c;
            background: #102b45;
            color: white;
            font-size: 16px;
        }

        select {
            cursor: pointer;
        }

        input[type="number"] {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        input[type="datetime-local"] {
            font-size: 15px;
        }

        .score-title {
            text-align: center;
            margin: 25px 0 10px;
        }

        .match-preview {
            background: #071827;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .teams-preview {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .preview-team {
            flex: 1;
            font-weight: bold;
        }

        .vs {
            font-size: 20px;
            font-weight: bold;
            color: #4da0ff;
        }

        .save-button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #1675e8;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #0f5fbe;
        }

        .save-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #123d26;
            color: #66e39a;
        }

        .error {
            background: #4a1515;
            color: #ff7777;
        }

        .loading {
            background: #493c12;
            color: #ffd95a;
        }

        @media (max-width: 600px) {

            .admin-container {
                padding: 12px;
            }

            .admin-box {
                padding: 18px;
            }

            .teams-preview {
                flex-direction: column;
            }

            .vs {
                margin: 5px 0;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🏆 MA'OR CHAMPIONS LEAGUE</h1>

    <p>Administration du tournoi</p>

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="matchs.html">
            ⚽ Matchs
        </a>

        <a href="classement.html">
            🏆 Classement
        </a>

        <a href="equipes.html">
            👥 Équipes
        </a>

        <a href="admin.html">
            🔐 Admin
        </a>

    </nav>

</header>



<main class="admin-container">


    <div class="admin-box">


        <h2>
            🔐 ADMINISTRATION
        </h2>


        <!-- CLUB DOMICILE -->

        <div class="form-group">

            <label for="homeTeam">
                🏠 Club domicile
            </label>

            <select id="homeTeam">

                <option value="">
                    -- Choisir le club domicile --
                </option>

                <option value="MA'OR FC">
                    MA'OR FC
                </option>

                <option value="Ichokan FC">
                    Ichokan FC
                </option>

                <option value="Koussoukpa FC">
                    Koussoukpa FC
                </option>

                <option value="New King FC">
                    New King FC
                </option>

                <option value="Club Olympique FC">
                    Club Olympique FC
                </option>

                <option value="Providence FC">
                    Providence FC
                </option>

                <option value="AS Police FC">
                    AS Police FC
                </option>

                <option value="Ayetedjou FC">
                    Ayetedjou FC
                </option>

                <option value="Agadjaligbo FC">
                    Agadjaligbo FC
                </option>

                <option value="Club Les Amis FC">
                    Club Les Amis FC
                </option>

                <option value="Sport Foot FC">
                    Sport Foot FC
                </option>

                <option value="Réveil FC">
                    Réveil FC
                </option>

                <option value="Hlagba Zakpo FC">
                    Hlagba Zakpo FC
                </option>

                <option value="Zalimey FC">
                    Zalimey FC
                </option>

                <option value="Zougame FC">
                    Zougame FC
                </option>

            </select>

        </div>



        <!-- SCORE DOMICILE -->

        <div class="form-group">

            <label for="homeScore">
                ⚽ Score domicile
            </label>

            <input
                type="number"
                id="homeScore"
                min="0"
                value="0"
            >

        </div>



        <!-- CLUB EXTÉRIEUR -->

        <div class="form-group">

            <label for="awayTeam">
                ✈️ Club extérieur
            </label>

            <select id="awayTeam">

                <option value="">
                    -- Choisir le club extérieur --
                </option>

                <option value="MA'OR FC">
                    MA'OR FC
                </option>

                <option value="Ichokan FC">
                    Ichokan FC
                </option>

                <option value="Koussoukpa FC">
                    Koussoukpa FC
                </option>

                <option value="New King FC">
                    New King FC
                </option>

                <option value="Club Olympique FC">
                    Club Olympique FC
                </option>

                <option value="Providence FC">
                    Providence FC
                </option>

                <option value="AS Police FC">
                    AS Police FC
                </option>

                <option value="Ayetedjou FC">
                    Ayetedjou FC
                </option>

                <option value="Agadjaligbo FC">
                    Agadjaligbo FC
                </option>

                <option value="Club Les Amis FC">
                    Club Les Amis FC
                </option>

                <option value="Sport Foot FC">
                    Sport Foot FC
                </option>

                <option value="Réveil FC">
                    Réveil FC
                </option>

                <option value="Hlagba Zakpo FC">
                    Hlagba Zakpo FC
                </option>

                <option value="Zalimey FC">
                    Zalimey FC
                </option>

                <option value="Zougame FC">
                    Zougame FC
                </option>

            </select>

        </div>



        <!-- SCORE EXTÉRIEUR -->

        <div class="form-group">

            <label for="awayScore">
                ⚽ Score extérieur
            </label>

            <input
                type="number"
                id="awayScore"
                min="0"
                value="0"
            >

        </div>



        <!-- DATE -->

        <div class="form-group">

            <label for="matchDate">
                📅 Date et heure du match
            </label>

            <input
                type="datetime-local"
                id="matchDate"
            >

        </div>



        <!-- APERÇU -->

        <div class="match-preview">

            <div class="teams-preview">

                <div
                    class="preview-team"
                    id="previewHome"
                >
                    Domicile
                </div>


                <div class="vs">
                    VS
                </div>


                <div
                    class="preview-team"
                    id="previewAway"
                >
                    Extérieur
                </div>

            </div>


            <br>


            <strong id="previewScore">
                0 - 0
            </strong>

        </div>



        <!-- BOUTON -->

        <button
            class="save-button"
            id="saveMatch"
        >

            ⚽ ENREGISTRER LE MATCH

        </button>



        <!-- MESSAGE -->

        <div id="message"></div>


    </div>

</main>



<footer>

    <h3>
        🏆 MA'OR CHAMPIONS LEAGUE
    </h3>

    <p>
        © 2026 MA'OR Champions League
    </p>

</footer>



<script type="module">


    /*
        IMPORT FIREBASE
    */

    import {

        database,
        ref,
        push,
        set

    } from "./js/firebase.js";



    /*
        RÉCUPÉRATION DES ÉLÉMENTS
    */

    const homeTeam =
        document.getElementById("homeTeam");


    const awayTeam =
        document.getElementById("awayTeam");


    const homeScore =
        document.getElementById("homeScore");


    const awayScore =
        document.getElementById("awayScore");


    const matchDate =
        document.getElementById("matchDate");


    const saveButton =
        document.getElementById("saveMatch");


    const message =
        document.getElementById("message");


    const previewHome =
        document.getElementById("previewHome");


    const previewAway =
        document.getElementById("previewAway");


    const previewScore =
        document.getElementById("previewScore");



    /*
        APERÇU DU MATCH
    */

    function updatePreview() {


        previewHome.textContent =
            homeTeam.value || "Domicile";


        previewAway.textContent =
            awayTeam.value || "Extérieur";


        previewScore.textContent =
            homeScore.value + " - " +
            awayScore.value;

    }



    homeTeam.addEventListener(
        "change",
        updatePreview
    );


    awayTeam.addEventListener(
        "change",
        updatePreview
    );


    homeScore.addEventListener(
        "input",
        updatePreview
    );


    awayScore.addEventListener(
        "input",
        updatePreview
    );



    /*
        ENREGISTRER LE MATCH
    */

    saveButton.addEventListener(
        "click",
        async function () {


            const home =
                homeTeam.value;


            const away =
                awayTeam.value;


            const scoreHome =
                Number(homeScore.value);


            const scoreAway =
                Number(awayScore.value);


            const date =
                matchDate.value;



            /*
                VÉRIFICATIONS
            */

            if (home === "") {

                showMessage(
                    "❌ Choisissez le club domicile.",
                    "error"
                );

                return;

            }


            if (away === "") {

                showMessage(
                    "❌ Choisissez le club extérieur.",
                    "error"
                );

                return;

            }


            if (home === away) {

                showMessage(
                    "❌ Les deux clubs doivent être différents.",
                    "error"
                );

                return;

            }


            if (
                scoreHome < 0 ||
                scoreAway < 0
            ) {

                showMessage(
                    "❌ Le score est invalide.",
                    "error"
                );

                return;

            }



            /*
                MESSAGE DE CHARGEMENT
            */

            showMessage(
                "⏳ Enregistrement en cours...",
                "loading"
            );


            saveButton.disabled = true;



            try {


                /*
                    RÉFÉRENCE À FIREBASE

                    matches = dossier des matchs
                */

                const matchesRef =
                    ref(
                        database,
                        "matches"
                    );



                /*
                    CRÉER UN NOUVEL ID
                */

                const newMatch =
                    push(matchesRef);



                /*
                    ENREGISTRER
                */

                await set(
                    newMatch,
                    {

                        homeTeam: home,

                        awayTeam: away,

                        homeScore: scoreHome,

                        awayScore: scoreAway,

                        date: date,

                        status: "termine",

                        createdAt:
                            new Date()
                            .toISOString()

                    }
                );



                /*
                    SUCCÈS
                */

                showMessage(
                    "✅ MATCH ENREGISTRÉ AVEC SUCCÈS !",
                    "success"
                );



                /*
                    RÉINITIALISER
                */

                homeTeam.value = "";

                awayTeam.value = "";

                homeScore.value = 0;

                awayScore.value = 0;

                matchDate.value = "";

                updatePreview();


            }

            catch (error) {


                console.error(error);


                showMessage(
                    "❌ Erreur Firebase : " +
                    error.message,
                    "error"
                );

            }


            finally {

                saveButton.disabled = false;

            }

        }
    );



    /*
        AFFICHER UN MESSAGE
    */

    function showMessage(
        text,
        type
    ) {

        message.textContent = text;

        message.className = type;

    }


</script>


</body>

</html>
