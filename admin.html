<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - MA'OR Champions League</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-box {
            max-width: 600px;
            margin: 30px auto;
            background: #0c1d31;
            padding: 25px;
            border-radius: 15px;
        }

        .admin-box label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .admin-box select,
        .admin-box input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #35536f;
            background: #102b45;
            color: white;
            font-size: 16px;
        }

        .admin-box button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            background: #1675e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .admin-box button:hover {
            background: #0f5fbe;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <h1>🏆 MA'OR CHAMPIONS LEAGUE</h1>

    <p>Administration du tournoi</p>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="matchs.html">⚽ Matchs</a>
        <a href="classement.html">🏆 Classement</a>
        <a href="equipes.html">👥 Équipes</a>
        <a href="admin.html">🔐 Admin</a>
    </nav>

</header>


<main class="container">

    <h2>🔐 Administration</h2>

    <div class="admin-box">

        <h3>⚽ Enregistrer un résultat</h3>


        <!-- CLUB DOMICILE -->

        <label for="homeTeam">
            🏠 Club domicile
        </label>

        <select id="homeTeam">

            <option value="">
                -- Choisir le club domicile --
            </option>

            <option value="MA'OR FC">MA'OR FC</option>
            <option value="Ichokan FC">Ichokan FC</option>
            <option value="Koussoukpa FC">Koussoukpa FC</option>
            <option value="New King FC">New King FC</option>
            <option value="Club Olympique FC">Club Olympique FC</option>
            <option value="Providence FC">Providence FC</option>
            <option value="AS Police FC">AS Police FC</option>
            <option value="Ayetedjou FC">Ayetedjou FC</option>
            <option value="Agadjaligbo FC">Agadjaligbo FC</option>
            <option value="Club Les Amis FC">Club Les Amis FC</option>
            <option value="Sport Foot FC">Sport Foot FC</option>
            <option value="Réveil FC">Réveil FC</option>
            <option value="Hlagba Zakpo FC">Hlagba Zakpo FC</option>
            <option value="Zalimey FC">Zalimey FC</option>
            <option value="Zougame FC">Zougame FC</option>

        </select>


        <!-- SCORE DOMICILE -->

        <label for="homeScore">
            ⚽ Score domicile
        </label>

        <input
            type="number"
            id="homeScore"
            min="0"
            value="0"
        >


        <!-- CLUB EXTÉRIEUR -->

        <label for="awayTeam">
            ✈️ Club extérieur
        </label>

        <select id="awayTeam">

            <option value="">
                -- Choisir le club extérieur --
            </option>

            <option value="MA'OR FC">MA'OR FC</option>
            <option value="Ichokan FC">Ichokan FC</option>
            <option value="Koussoukpa FC">Koussoukpa FC</option>
            <option value="New King FC">New King FC</option>
            <option value="Club Olympique FC">Club Olympique FC</option>
            <option value="Providence FC">Providence FC</option>
            <option value="AS Police FC">AS Police FC</option>
            <option value="Ayetedjou FC">Ayetedjou FC</option>
            <option value="Agadjaligbo FC">Agadjaligbo FC</option>
            <option value="Club Les Amis FC">Club Les Amis FC</option>
            <option value="Sport Foot FC">Sport Foot FC</option>
            <option value="Réveil FC">Réveil FC</option>
            <option value="Hlagba Zakpo FC">Hlagba Zakpo FC</option>
            <option value="Zalimey FC">Zalimey FC</option>
            <option value="Zougame FC">Zougame FC</option>

        </select>


        <!-- SCORE EXTÉRIEUR -->

        <label for="awayScore">
            ⚽ Score extérieur
        </label>

        <input
            type="number"
            id="awayScore"
            min="0"
            value="0"
        >


        <!-- DATE -->

        <label for="matchDate">
            📅 Date du match
        </label>

        <input
            type="datetime-local"
            id="matchDate"
        >


        <!-- BOUTON ENREGISTRER -->

        <button id="saveMatch">
            ⚽ ENREGISTRER LE MATCH
        </button>


        <p id="message"></p>

    </div>

</main>


<footer>

    © 2026 MA'OR Champions League

</footer>


<script type="module">

    import {
        database,
        ref,
        push,
        set
    } from "./js/firebase.js";


    const saveButton =
        document.getElementById("saveMatch");


    saveButton.addEventListener("click", async function () {

        const homeTeam =
            document.getElementById("homeTeam").value;

        const awayTeam =
            document.getElementById("awayTeam").value;

        const homeScore =
            Number(document.getElementById("homeScore").value);

        const awayScore =
            Number(document.getElementById("awayScore").value);

        const matchDate =
            document.getElementById("matchDate").value;

        const message =
            document.getElementById("message");


        // Vérifier les clubs

        if (homeTeam === "") {

            message.textContent =
                "❌ Choisissez le club domicile.";

            return;
        }


        if (awayTeam === "") {

            message.textContent =
                "❌ Choisissez le club extérieur.";

            return;
        }


        // Vérifier les équipes

        if (homeTeam === awayTeam) {

            message.textContent =
                "❌ Les deux clubs doivent être différents.";

            return;
        }


        // Vérifier les scores

        if (homeScore < 0 || awayScore < 0) {

            message.textContent =
                "❌ Le score est invalide.";

            return;
        }


        try {

            const matchesRef =
                ref(database, "matches");


            const newMatch =
                push(matchesRef);


            await set(newMatch, {

                homeTeam: homeTeam,

                awayTeam: awayTeam,

                homeScore: homeScore,

                awayScore: awayScore,

                date: matchDate,

                status: "termine",

                createdAt:
                    new Date().toISOString()

            });


            message.textContent =
                "✅ MATCH ENREGISTRÉ AVEC SUCCÈS !";


            document.getElementById("homeScore").value = 0;

            document.getElementById("awayScore").value = 0;


        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Erreur Firebase : " + error.message;

        }

    });

</script>

</body>

</html>
