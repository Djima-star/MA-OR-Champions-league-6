<!DOCTYPE html>
<html lang="fr">

<head>

<body>

<header>

    <h1>🏆 MA'OR CHAMPIONS LEAGUE</h1>

    <nav>
        <a href="index.html">Accueil</a>

    </nav>

</header>


<main class="container">

    <h2>🏆 Classement</h2>

    <br>

    <div style="overflow-x:auto;">

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Équipe</th>
                    <th>MJ</th>
                    <th>V</th>
                    <th>N</th>
                    <th>D</th>
                    <th>BP</th>
                    <th>BC</th>
                    <th>Diff</th>
                    <th>Pts</th>
                </tr>

            </thead>

            <tbody id="ranking">

            </tbody>

        </table>

    </div>

</main>


<footer>

    © 2026 MA'OR Champions League

</footer>


<script src="js/data.js"></script>

<script>

    const ranking = document.getElementById("ranking");


    TEAMS.forEach((team, index) => {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${index + 1}</td>

            <td>
                <strong>${team}</strong>
            </td>

            <td>0</td>

            <td>0</td>

            <td>0</td>

            <td>0</td>

            <td>0</td>

            <td>0</td>

            <td>0</td>

            <td>
                <strong>0</strong>
            </td>

        `;

        ranking.appendChild(row);

    });

</script>

</body>
